<svg xmlns="http://www.w3.org/2000/svg" width="272" height="120" viewBox="0 0 272 120"><style>@font-face{font-family:P;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:P;font-weight:600;src:url(data:font/woff;base64,) format('woff')}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fade{from{opacity:0}}
.a{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.f{animation:fade .5s ease-out both}
.still{display:none}
