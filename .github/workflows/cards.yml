name: Refresh profile cards

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch contribution data
        env:
          # Optional CONTRIB_TOKEN (PAT with read:user) also counts private contributions.
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN || github.token }}
        run: gh api graphql -F login="${{ github.repository_owner }}" -f query="$(cat scripts/contributions.graphql)" > data/contributions.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Render cards
        run: |
          pip install fonttools
          python scripts/render_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data README.md
          git diff --cached --quiet || { git commit -m "Refresh profile cards"; git push; }
